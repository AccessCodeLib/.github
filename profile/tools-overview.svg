text{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;dominant-baseline:central}
.t{font-size:16px;font-weight:600}
.s{font-size:13px}
.p{font-size:12px;font-weight:600}
</style>
