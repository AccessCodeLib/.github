<svg viewBox="0 84 960 885" width="960" height="885" role="img" aria-label="How the tools work together in everyday Access development" xmlns="http://www.w3.org/2000/svg">
<title>How the tools work together in everyday Access development</title>
<desc>The developer assigns tasks to an AI agent, which returns its changes for review. AccessCodeLib with its catalog supplies modules to ACLibImportWizard, FilterFormWizard and DbmsConnectionWizard, which bring them into Microsoft Access. Access contains the VBA editor and works with the accdb for development. AccUnit runs tests in the VBA editor. msaccess-vcs exports the application as text into the application repository; AccUnit and ACLibDeclarationDictionaryAddIn run beforehand. Natural Docs generates online documentation from the repositories. In the CI/CD workflow, msaccess-vcs-build builds the accdb or accde for production from the repository. Badges show what the developer operates (Dev), what AI agents can use via MCP servers (AI) and what runs automatically via CI/CD.</desc>
